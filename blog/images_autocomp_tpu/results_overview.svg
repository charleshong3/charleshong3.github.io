<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="Inter, Helvetica Neue, sans-serif">
  <defs>
    <linearGradient id="bar-blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="100%" stop-color="#669DF6"/>
    </linearGradient>
    <linearGradient id="bar-green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e8e3e"/>
      <stop offset="100%" stop-color="#34A853"/>
    </linearGradient>
  </defs>

  <!-- Left panel: x=45..420, center=232  Right panel: x=480..855, center=668  Divider: x=450 -->

  <!-- LEFT HEADER -->
  <text x="232" y="38" text-anchor="middle" font-size="14" font-weight="600" fill="#5f6368" letter-spacing="0.5">OPTIMIZING HAND-TUNED PALLAS</text>
  <line x1="45" y1="50" x2="420" y2="50" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Flash Attention: baseline 0.371ms, autocomp 0.264ms, 1.41x -->
  <text x="45" y="86" font-size="15" font-weight="500" fill="#202124">Flash Attention</text>
  <text x="420" y="86" font-size="16" font-weight="700" fill="#1a73e8" text-anchor="end">1.41&#xd7;</text>
  <rect x="45" y="96" width="375" height="30" rx="5" fill="url(#bar-blue)" opacity="0.2"/>
  <rect x="45" y="96" width="267" height="30" rx="5" fill="url(#bar-blue)"/>
  <text x="52" y="116" font-size="13" fill="#fff" font-weight="600">0.264 ms</text>
  <text x="416" y="116" font-size="13" fill="#444" font-weight="500" text-anchor="end">0.371 ms</text>

  <!-- Ragged Paged Attention: baseline 0.644ms, autocomp 0.587ms, 1.10x -->
  <text x="45" y="156" font-size="15" font-weight="500" fill="#202124">Ragged Paged Attention</text>
  <text x="420" y="156" font-size="16" font-weight="700" fill="#1a73e8" text-anchor="end">1.10&#xd7;</text>
  <rect x="45" y="166" width="375" height="30" rx="5" fill="url(#bar-blue)" opacity="0.2"/>
  <rect x="45" y="166" width="342" height="30" rx="5" fill="url(#bar-blue)"/>
  <text x="52" y="186" font-size="13" fill="#fff" font-weight="600">0.587 ms</text>
  <text x="416" y="186" font-size="13" fill="#444" font-weight="500" text-anchor="end">0.644 ms</text>

  <!-- Legend -->
  <g transform="translate(45, 225)">
    <rect x="0" y="0" width="14" height="14" rx="2" fill="url(#bar-blue)"/>
    <text x="20" y="12" font-size="11" fill="#5f6368">Autocomp</text>
    <rect x="100" y="0" width="14" height="14" rx="2" fill="url(#bar-blue)" opacity="0.2"/>
    <text x="120" y="12" font-size="11" fill="#5f6368">Baseline</text>
  </g>

  <text x="232" y="290" text-anchor="middle" font-size="13" fill="#9aa0a6">TPU v6e-1 (Trillium) &#xb7; JAX 0.6.2</text>

  <!-- DIVIDER -->
  <line x1="450" y1="20" x2="450" y2="320" stroke="#e0e0e0" stroke-width="1"/>

  <!-- RIGHT HEADER -->
  <text x="668" y="38" text-anchor="middle" font-size="14" font-weight="600" fill="#5f6368" letter-spacing="0.5">JAX &#x2192; PALLAS TRANSLATION + OPTIMIZATION</text>
  <line x1="480" y1="50" x2="855" y2="50" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Mamba-2 SSD: baseline 1.587ms, autocomp 0.363ms, 4.37x -->
  <text x="480" y="86" font-size="15" font-weight="500" fill="#202124">Mamba-2 SSD</text>
  <text x="855" y="86" font-size="16" font-weight="700" fill="#1e8e3e" text-anchor="end">4.37&#xd7;</text>
  <rect x="480" y="96" width="375" height="28" rx="5" fill="url(#bar-green)" opacity="0.15"/>
  <rect x="480" y="96" width="86" height="28" rx="5" fill="url(#bar-green)"/>
  <text x="487" y="115" font-size="13" fill="#fff" font-weight="600">0.363 ms</text>
  <text x="851" y="115" font-size="13" fill="#444" font-weight="500" text-anchor="end">1.587 ms</text>

  <!-- RetNet Retention: baseline 0.520ms, autocomp 0.199ms, 2.61x -->
  <text x="480" y="148" font-size="15" font-weight="500" fill="#202124">RetNet Retention</text>
  <text x="855" y="148" font-size="16" font-weight="700" fill="#1e8e3e" text-anchor="end">2.61&#xd7;</text>
  <rect x="480" y="158" width="375" height="28" rx="5" fill="url(#bar-green)" opacity="0.15"/>
  <rect x="480" y="158" width="144" height="28" rx="5" fill="url(#bar-green)"/>
  <text x="487" y="177" font-size="13" fill="#fff" font-weight="600">0.199 ms</text>
  <text x="851" y="177" font-size="13" fill="#444" font-weight="500" text-anchor="end">0.520 ms</text>

  <!-- MLA Attention: baseline 4.543ms, autocomp 2.458ms, 1.85x -->
  <text x="480" y="210" font-size="15" font-weight="500" fill="#202124">MLA Attention</text>
  <text x="855" y="210" font-size="16" font-weight="700" fill="#1e8e3e" text-anchor="end">1.85&#xd7;</text>
  <rect x="480" y="220" width="375" height="28" rx="5" fill="url(#bar-green)" opacity="0.15"/>
  <rect x="480" y="220" width="203" height="28" rx="5" fill="url(#bar-green)"/>
  <text x="487" y="239" font-size="13" fill="#fff" font-weight="600">2.458 ms</text>
  <text x="851" y="239" font-size="13" fill="#444" font-weight="500" text-anchor="end">4.543 ms</text>

  <!-- Sparse MoE: baseline 8.268ms, autocomp 6.357ms, 1.30x -->
  <text x="480" y="272" font-size="15" font-weight="500" fill="#202124">Sparse MoE</text>
  <text x="855" y="272" font-size="16" font-weight="700" fill="#1e8e3e" text-anchor="end">1.30&#xd7;</text>
  <rect x="480" y="282" width="375" height="28" rx="5" fill="url(#bar-green)" opacity="0.15"/>
  <rect x="480" y="282" width="288" height="28" rx="5" fill="url(#bar-green)"/>
  <text x="487" y="301" font-size="13" fill="#fff" font-weight="600">6.357 ms</text>
  <text x="851" y="301" font-size="13" fill="#444" font-weight="500" text-anchor="end">8.268 ms</text>
</svg>
