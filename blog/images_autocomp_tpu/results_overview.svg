<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Inter, Helvetica Neue, sans-serif">
  <defs>
    <linearGradient id="bar-blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="100%" stop-color="#669DF6"/>
    </linearGradient>
    <linearGradient id="bar-green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e8e3e"/>
      <stop offset="100%" stop-color="#34A853"/>
    </linearGradient>
  </defs>

  <rect width="900" height="380" fill="none"/>

  <!-- Left section header -->
  <text x="215" y="38" text-anchor="middle" font-size="14" font-weight="600" fill="#5f6368" letter-spacing="0.5">OPTIMIZING HAND-TUNED PALLAS</text>
  <line x1="40" y1="50" x2="400" y2="50" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Flash Attention -->
  <text x="45" y="86" font-size="15" font-weight="500" fill="#202124">Flash Attention</text>
  <text x="400" y="86" font-size="16" font-weight="700" fill="#1a73e8" text-anchor="end">1.41&#xd7;</text>
  <rect x="45" y="96" width="355" height="30" rx="5" fill="url(#bar-blue)" opacity="0.2"/>
  <rect x="45" y="96" width="252" height="30" rx="5" fill="url(#bar-blue)"/>
  <text x="52" y="116" font-size="12" fill="#fff" font-weight="600">0.264 ms</text>
  <text x="396" y="116" font-size="11" fill="#5f6368" text-anchor="end">0.371 ms</text>

  <!-- Ragged Paged Attention -->
  <text x="45" y="156" font-size="15" font-weight="500" fill="#202124">Ragged Paged Attention</text>
  <text x="400" y="156" font-size="16" font-weight="700" fill="#1a73e8" text-anchor="end">1.10&#xd7;</text>
  <rect x="45" y="166" width="355" height="30" rx="5" fill="url(#bar-blue)" opacity="0.2"/>
  <rect x="45" y="166" width="323" height="30" rx="5" fill="url(#bar-blue)"/>
  <text x="52" y="186" font-size="12" fill="#fff" font-weight="600">0.587 ms</text>
  <text x="396" y="186" font-size="11" fill="#5f6368" text-anchor="end">0.644 ms</text>

  <!-- Legend left -->
  <g transform="translate(45, 225)">
    <rect x="0" y="0" width="14" height="14" rx="2" fill="url(#bar-blue)"/>
    <text x="20" y="12" font-size="11" fill="#5f6368">Autocomp</text>
    <rect x="100" y="0" width="14" height="14" rx="2" fill="url(#bar-blue)" opacity="0.2"/>
    <text x="120" y="12" font-size="11" fill="#5f6368">Baseline</text>
  </g>

  <text x="215" y="340" text-anchor="middle" font-size="13" fill="#9aa0a6">TPU v6e-1 (Trillium) &#xb7; JAX 0.6.2</text>

  <!-- Divider -->
  <line x1="450" y1="20" x2="450" y2="355" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Right section header -->
  <text x="670" y="38" text-anchor="middle" font-size="14" font-weight="600" fill="#5f6368" letter-spacing="0.5">JAX &#x2192; PALLAS TRANSLATION + OPTIMIZATION</text>
  <line x1="470" y1="50" x2="870" y2="50" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Mamba-2 SSD -->
  <text x="475" y="86" font-size="15" font-weight="500" fill="#202124">Mamba-2 SSD</text>
  <text x="865" y="86" font-size="16" font-weight="700" fill="#1e8e3e" text-anchor="end">4.37&#xd7;</text>
  <rect x="475" y="96" width="360" height="28" rx="5" fill="url(#bar-green)" opacity="0.15"/>
  <rect x="475" y="96" width="82" height="28" rx="5" fill="url(#bar-green)"/>
  <text x="482" y="115" font-size="11" fill="#fff" font-weight="600">0.363</text>
  <text x="831" y="115" font-size="11" fill="#5f6368" text-anchor="end">1.587 ms</text>

  <!-- RetNet -->
  <text x="475" y="148" font-size="15" font-weight="500" fill="#202124">RetNet Retention</text>
  <text x="865" y="148" font-size="16" font-weight="700" fill="#1e8e3e" text-anchor="end">2.61&#xd7;</text>
  <rect x="475" y="158" width="360" height="28" rx="5" fill="url(#bar-green)" opacity="0.15"/>
  <rect x="475" y="158" width="138" height="28" rx="5" fill="url(#bar-green)"/>
  <text x="482" y="177" font-size="11" fill="#fff" font-weight="600">0.199</text>
  <text x="831" y="177" font-size="11" fill="#5f6368" text-anchor="end">0.520 ms</text>

  <!-- MLA -->
  <text x="475" y="210" font-size="15" font-weight="500" fill="#202124">MLA Attention</text>
  <text x="865" y="210" font-size="16" font-weight="700" fill="#1e8e3e" text-anchor="end">1.85&#xd7;</text>
  <rect x="475" y="220" width="360" height="28" rx="5" fill="url(#bar-green)" opacity="0.15"/>
  <rect x="475" y="220" width="195" height="28" rx="5" fill="url(#bar-green)"/>
  <text x="482" y="239" font-size="11" fill="#fff" font-weight="600">2.458</text>
  <text x="831" y="239" font-size="11" fill="#5f6368" text-anchor="end">4.543 ms</text>

  <!-- Sparse MoE -->
  <text x="475" y="272" font-size="15" font-weight="500" fill="#202124">Sparse MoE</text>
  <text x="865" y="272" font-size="16" font-weight="700" fill="#1e8e3e" text-anchor="end">1.30&#xd7;</text>
  <rect x="475" y="282" width="360" height="28" rx="5" fill="url(#bar-green)" opacity="0.15"/>
  <rect x="475" y="282" width="277" height="28" rx="5" fill="url(#bar-green)"/>
  <text x="482" y="301" font-size="11" fill="#fff" font-weight="600">6.357</text>
  <text x="831" y="301" font-size="11" fill="#5f6368" text-anchor="end">8.268 ms</text>
</svg>
