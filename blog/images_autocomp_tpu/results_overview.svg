<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" font-family="Inter, Helvetica Neue, sans-serif">
  <defs>
    <linearGradient id="bar-blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="100%" stop-color="#669DF6"/>
    </linearGradient>
    <linearGradient id="bar-green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e8e3e"/>
      <stop offset="100%" stop-color="#34A853"/>
    </linearGradient>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <rect width="840" height="330" rx="12" fill="none"/>

  <!-- Left section header -->
  <text x="210" y="36" text-anchor="middle" font-size="13" font-weight="600" fill="#5f6368" letter-spacing="0.5">OPTIMIZING HAND-TUNED PALLAS</text>
  <line x1="40" y1="46" x2="380" y2="46" stroke="#e8eaed" stroke-width="1"/>

  <!-- Flash Attention -->
  <text x="45" y="78" font-size="13" font-weight="500" fill="#202124">Flash Attention</text>
  <text x="380" y="78" font-size="14" font-weight="700" fill="#1a73e8" text-anchor="end">1.41&#xd7;</text>
  <rect x="45" y="86" width="335" height="26" rx="4" fill="url(#bar-blue)" opacity="0.2"/>
  <rect x="45" y="86" width="238" height="26" rx="4" fill="url(#bar-blue)"/>
  <text x="50" y="104" font-size="11" fill="#fff" font-weight="600">0.264 ms</text>
  <text x="376" y="104" font-size="10" fill="#5f6368" text-anchor="end">0.371 ms</text>

  <!-- Ragged Paged Attention -->
  <text x="45" y="136" font-size="13" font-weight="500" fill="#202124">Ragged Paged Attention</text>
  <text x="380" y="136" font-size="14" font-weight="700" fill="#1a73e8" text-anchor="end">1.10&#xd7;</text>
  <rect x="45" y="144" width="335" height="26" rx="4" fill="url(#bar-blue)" opacity="0.2"/>
  <rect x="45" y="144" width="305" height="26" rx="4" fill="url(#bar-blue)"/>
  <text x="50" y="162" font-size="11" fill="#fff" font-weight="600">0.587 ms</text>
  <text x="376" y="162" font-size="10" fill="#5f6368" text-anchor="end">0.644 ms</text>

  <!-- Legend left -->
  <g transform="translate(45, 195)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="url(#bar-blue)"/>
    <text x="17" y="11" font-size="10" fill="#5f6368">Autocomp</text>
    <rect x="90" y="0" width="12" height="12" rx="2" fill="url(#bar-blue)" opacity="0.2"/>
    <text x="107" y="11" font-size="10" fill="#5f6368">Baseline</text>
  </g>

  <text x="210" y="300" text-anchor="middle" font-size="12" fill="#9aa0a6">TPU v6e-1 (Trillium) &#xb7; JAX 0.6.2</text>

  <!-- Divider -->
  <line x1="420" y1="20" x2="420" y2="310" stroke="#e8eaed" stroke-width="1"/>

  <!-- Right section header -->
  <text x="630" y="36" text-anchor="middle" font-size="13" font-weight="600" fill="#5f6368" letter-spacing="0.5">JAX &#x2192; PALLAS TRANSLATION + OPTIMIZATION</text>
  <line x1="440" y1="46" x2="820" y2="46" stroke="#e8eaed" stroke-width="1"/>

  <!-- Mamba-2 SSD -->
  <text x="445" y="78" font-size="13" font-weight="500" fill="#202124">Mamba-2 SSD</text>
  <text x="810" y="78" font-size="14" font-weight="700" fill="#1e8e3e" text-anchor="end">4.37&#xd7;</text>
  <rect x="445" y="86" width="335" height="24" rx="4" fill="url(#bar-green)" opacity="0.15"/>
  <rect x="445" y="86" width="77" height="24" rx="4" fill="url(#bar-green)"/>
  <text x="450" y="103" font-size="10" fill="#fff" font-weight="600">0.363</text>
  <text x="776" y="103" font-size="10" fill="#5f6368" text-anchor="end">1.587 ms</text>

  <!-- RetNet -->
  <text x="445" y="128" font-size="13" font-weight="500" fill="#202124">RetNet Retention</text>
  <text x="810" y="128" font-size="14" font-weight="700" fill="#1e8e3e" text-anchor="end">2.61&#xd7;</text>
  <rect x="445" y="136" width="335" height="24" rx="4" fill="url(#bar-green)" opacity="0.15"/>
  <rect x="445" y="136" width="128" height="24" rx="4" fill="url(#bar-green)"/>
  <text x="450" y="153" font-size="10" fill="#fff" font-weight="600">0.199</text>
  <text x="776" y="153" font-size="10" fill="#5f6368" text-anchor="end">0.520 ms</text>

  <!-- MLA -->
  <text x="445" y="178" font-size="13" font-weight="500" fill="#202124">MLA Attention</text>
  <text x="810" y="178" font-size="14" font-weight="700" fill="#1e8e3e" text-anchor="end">1.85&#xd7;</text>
  <rect x="445" y="186" width="335" height="24" rx="4" fill="url(#bar-green)" opacity="0.15"/>
  <rect x="445" y="186" width="181" height="24" rx="4" fill="url(#bar-green)"/>
  <text x="450" y="203" font-size="10" fill="#fff" font-weight="600">2.458</text>
  <text x="776" y="203" font-size="10" fill="#5f6368" text-anchor="end">4.543 ms</text>

  <!-- Sparse MoE -->
  <text x="445" y="228" font-size="13" font-weight="500" fill="#202124">Sparse MoE</text>
  <text x="810" y="228" font-size="14" font-weight="700" fill="#1e8e3e" text-anchor="end">1.30&#xd7;</text>
  <rect x="445" y="236" width="335" height="24" rx="4" fill="url(#bar-green)" opacity="0.15"/>
  <rect x="445" y="236" width="258" height="24" rx="4" fill="url(#bar-green)"/>
  <text x="450" y="253" font-size="10" fill="#fff" font-weight="600">6.357</text>
  <text x="776" y="253" font-size="10" fill="#5f6368" text-anchor="end">8.268 ms</text>
</svg>
