<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="Inter, Helvetica Neue, sans-serif">
  <defs>
    <linearGradient id="active" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="100%" stop-color="#1a6ddb"/>
    </linearGradient>
    <linearGradient id="diag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34A853"/>
      <stop offset="100%" stop-color="#1e8e3e"/>
    </linearGradient>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#ccc" stroke-width="1.5"/>
    </pattern>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#202124"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="410" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#202124">Causal Wavefront Microtiling &#x2014; Flash Attention on TPU v6e</text>

  <!-- === LEFT PANEL (centered at x=195) === -->
  <text x="195" y="68" text-anchor="middle" font-size="15" font-weight="600" fill="#5f6368">Baseline: computes all 16 subtiles</text>
  <text x="195" y="90" text-anchor="middle" font-size="12" fill="#80868b">K/V blocks &#x2192;</text>
  <text x="40" y="230" text-anchor="middle" font-size="12" fill="#80868b" transform="rotate(-90 40 230)">Q blocks &#x2192;</text>

  <!-- Left grid: tiles at x=60,125,190,255  y=100,165,230,295 -->
  <!-- Row 0 -->
  <rect x="60" y="100" width="60" height="60" rx="4" fill="url(#diag)" opacity="0.9"/>
  <rect x="125" y="100" width="60" height="60" rx="4" fill="#e8eaed"/>
  <rect x="190" y="100" width="60" height="60" rx="4" fill="#e8eaed"/>
  <rect x="255" y="100" width="60" height="60" rx="4" fill="#e8eaed"/>
  <!-- Row 1 -->
  <rect x="60" y="165" width="60" height="60" rx="4" fill="url(#active)" opacity="0.9"/>
  <rect x="125" y="165" width="60" height="60" rx="4" fill="url(#diag)" opacity="0.9"/>
  <rect x="190" y="165" width="60" height="60" rx="4" fill="#e8eaed"/>
  <rect x="255" y="165" width="60" height="60" rx="4" fill="#e8eaed"/>
  <!-- Row 2 -->
  <rect x="60" y="230" width="60" height="60" rx="4" fill="url(#active)" opacity="0.9"/>
  <rect x="125" y="230" width="60" height="60" rx="4" fill="url(#active)" opacity="0.9"/>
  <rect x="190" y="230" width="60" height="60" rx="4" fill="url(#diag)" opacity="0.9"/>
  <rect x="255" y="230" width="60" height="60" rx="4" fill="#e8eaed"/>
  <!-- Row 3 -->
  <rect x="60" y="295" width="60" height="60" rx="4" fill="url(#active)" opacity="0.9"/>
  <rect x="125" y="295" width="60" height="60" rx="4" fill="url(#active)" opacity="0.9"/>
  <rect x="190" y="295" width="60" height="60" rx="4" fill="url(#active)" opacity="0.9"/>
  <rect x="255" y="295" width="60" height="60" rx="4" fill="url(#diag)" opacity="0.9"/>

  <!-- X marks on wasted tiles -->
  <g stroke="#9aa0a6" stroke-width="2" stroke-linecap="round">
    <line x1="135" y1="110" x2="175" y2="150"/><line x1="175" y1="110" x2="135" y2="150"/>
    <line x1="200" y1="110" x2="240" y2="150"/><line x1="240" y1="110" x2="200" y2="150"/>
    <line x1="265" y1="110" x2="305" y2="150"/><line x1="305" y1="110" x2="265" y2="150"/>
    <line x1="200" y1="175" x2="240" y2="215"/><line x1="240" y1="175" x2="200" y2="215"/>
    <line x1="265" y1="175" x2="305" y2="215"/><line x1="305" y1="175" x2="265" y2="215"/>
    <line x1="265" y1="240" x2="305" y2="280"/><line x1="305" y1="240" x2="265" y2="280"/>
  </g>

  <text x="195" y="380" text-anchor="middle" font-size="13" fill="#9aa0a6">16 MXU matmuls computed</text>
  <text x="195" y="398" text-anchor="middle" font-size="13" font-weight="600" fill="#d93025">6 produce only zeros (37.5% waste)</text>

  <!-- Arrow (centered at x=410) -->
  <line x1="370" y1="225" x2="440" y2="225" stroke="#202124" stroke-width="2.5" marker-end="url(#arrowhead)"/>

  <!-- === RIGHT PANEL (centered at x=625) === -->
  <text x="625" y="68" text-anchor="middle" font-size="15" font-weight="600" fill="#5f6368">Autocomp: skips structurally zero tiles</text>
  <text x="625" y="90" text-anchor="middle" font-size="12" fill="#80868b">K/V blocks &#x2192;</text>
  <text x="470" y="230" text-anchor="middle" font-size="12" fill="#80868b" transform="rotate(-90 470 230)">Q blocks &#x2192;</text>

  <!-- Right grid: tiles at x=490,555,620,685  y=100,165,230,295 -->
  <!-- Row 0 -->
  <rect x="490" y="100" width="60" height="60" rx="4" fill="url(#diag)" opacity="0.9"/>
  <rect x="555" y="100" width="60" height="60" rx="4" fill="url(#hatch)" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="620" y="100" width="60" height="60" rx="4" fill="url(#hatch)" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="685" y="100" width="60" height="60" rx="4" fill="url(#hatch)" stroke="#e0e0e0" stroke-width="1"/>
  <!-- Row 1 -->
  <rect x="490" y="165" width="60" height="60" rx="4" fill="url(#active)" opacity="0.9"/>
  <rect x="555" y="165" width="60" height="60" rx="4" fill="url(#diag)" opacity="0.9"/>
  <rect x="620" y="165" width="60" height="60" rx="4" fill="url(#hatch)" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="685" y="165" width="60" height="60" rx="4" fill="url(#hatch)" stroke="#e0e0e0" stroke-width="1"/>
  <!-- Row 2 -->
  <rect x="490" y="230" width="60" height="60" rx="4" fill="url(#active)" opacity="0.9"/>
  <rect x="555" y="230" width="60" height="60" rx="4" fill="url(#active)" opacity="0.9"/>
  <rect x="620" y="230" width="60" height="60" rx="4" fill="url(#diag)" opacity="0.9"/>
  <rect x="685" y="230" width="60" height="60" rx="4" fill="url(#hatch)" stroke="#e0e0e0" stroke-width="1"/>
  <!-- Row 3 -->
  <rect x="490" y="295" width="60" height="60" rx="4" fill="url(#active)" opacity="0.9"/>
  <rect x="555" y="295" width="60" height="60" rx="4" fill="url(#active)" opacity="0.9"/>
  <rect x="620" y="295" width="60" height="60" rx="4" fill="url(#active)" opacity="0.9"/>
  <rect x="685" y="295" width="60" height="60" rx="4" fill="url(#diag)" opacity="0.9"/>

  <!-- "skip" text -->
  <g font-size="11" fill="#bbb" text-anchor="middle" font-weight="500">
    <text x="585" y="135">skip</text>
    <text x="650" y="135">skip</text>
    <text x="715" y="135">skip</text>
    <text x="650" y="200">skip</text>
    <text x="715" y="200">skip</text>
    <text x="715" y="265">skip</text>
  </g>

  <text x="625" y="380" text-anchor="middle" font-size="13" font-weight="600" fill="#1a73e8">10 MXU matmuls &#x2014; only tiles that matter</text>
  <text x="625" y="398" text-anchor="middle" font-size="13" font-weight="700" fill="#34A853">0.332 ms &#x2192; 0.271 ms (1.23x faster)</text>

  <!-- Legend (centered at x=410) -->
  <g transform="translate(150, 420)">
    <rect x="0" y="0" width="14" height="14" rx="2" fill="url(#active)"/>
    <text x="20" y="12" font-size="11" fill="#5f6368">Lower triangle (non-zero)</text>
    <rect x="185" y="0" width="14" height="14" rx="2" fill="url(#diag)"/>
    <text x="205" y="12" font-size="11" fill="#5f6368">Diagonal (partial mask)</text>
    <rect x="370" y="0" width="14" height="14" rx="2" fill="#e8eaed"/>
    <text x="390" y="12" font-size="11" fill="#5f6368">Upper triangle (all zeros)</text>
  </g>
</svg>
