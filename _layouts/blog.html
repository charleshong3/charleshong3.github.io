---
layout: default
---

<article class="blog-post">
    {{ content }}
</article>

<nav class="blog-navigation" style="margin-top: 60px; padding-top: 30px; border-top: 2px solid #e9ecef;">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px;">
        <div style="flex: 1; min-width: 200px;">
            {% if page.previous_post %}
            <div style="text-align: left;">
                <span style="color: #666; font-size: 0.9em; text-transform: uppercase; letter-spacing: 0.5px;">← Previous</span>
                <br>
                <a href="{{ page.previous_post.url }}" style="font-weight: 500; font-size: 1.1em;">{{ page.previous_post.title }}</a>
            </div>
            {% endif %}
        </div>
        
        <div style="flex: 1; min-width: 200px;">
            {% if page.next_post %}
            <div style="text-align: right;">
                <span style="color: #666; font-size: 0.9em; text-transform: uppercase; letter-spacing: 0.5px;">Next →</span>
                <br>
                <a href="{{ page.next_post.url }}" style="font-weight: 500; font-size: 1.1em;">{{ page.next_post.title }}</a>
            </div>
            {% endif %}
        </div>
    </div>
</nav>
